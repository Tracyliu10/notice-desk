{% extends "base.html" %}
{% block content %}
<div class="login-layout">
<section class="login-intro">
<div class="document-art" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="login-copy">
<p class="login-kicker">TENANCY OPERATIONS</p>
<h1>Notice Desk</h1>
<p>Draft, review and sign RTA and OA notices.</p>
</div>
</section>
<section class="login-panel">
<h2>Sign in</h2>
<p class="muted">Use your Junior CM or CM account.</p>
<form method="post" class="stack">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Username <input name="username" autocomplete="username" placeholder="Enter your username" required autofocus></label>
<label>Password <input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></label>
<button>Sign in</button>
</form>
</section>
</div>
{% endblock %}
