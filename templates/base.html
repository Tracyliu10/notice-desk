<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Notice Desk{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script defer src="{{ url_for('static', filename='form.js') }}"></script>
</head>
<body>
<header><nav><a class="brand" href="{{ url_for('home') }}">Notice Desk</a>
{% if g.user %}<div class="bar"><span>{{ g.user.name }} · {{ 'CM' if g.user.role == 'cm' else 'Junior CM' }}</span>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="secondary">Sign out</button></form></div>{% endif %}
</nav></header>
<main>
{% for message in get_flashed_messages() %}<p role="alert" class="alert">{{ message }}</p>{% endfor %}
{% block content %}{% endblock %}
</main>
</body>
</html>
